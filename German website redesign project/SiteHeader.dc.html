<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F0E6;color:#1A1B18;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty}
a{color:#7A5A17;text-decoration:none}
a:hover{color:#7B2B22}
</style>
</helmet>
<header style="background:#F5F0E6;border-bottom:1px solid #DED3BC">
  <div style="max-width:1280px;margin:0 auto;padding:18px 24px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px">
    <a href="Startseite.dc.html" style="display:block;color:#1A1B18;text-decoration:none;line-height:1">
      <div style="font-family:Spectral,Georgia,serif;font-weight:500;font-size:25px;letter-spacing:0.005em;color:#14231F">Bibliotheca</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:#7A5A17;margin-top:5px">Psychonautica</div>
    </a>
    <div style="display:flex;align-items:center;gap:20px">
      <a href="Spenden.dc.html" style="font-size:14.5px;font-weight:500;color:#14231F;border-bottom:1px solid #C9BCA0;padding-bottom:2px" style-hover="color:#7B2B22;border-bottom-color:#7B2B22">Spenden</a>
      <a href="Mitglied-werden.dc.html" style="background:#7B2B22;color:#FBF8F2;font-size:14.5px;font-weight:600;letter-spacing:0.01em;padding:12px 22px;border-radius:2px;display:inline-block;white-space:nowrap" style-hover="background:#94382C;color:#FBF8F2">Mitglied werden</a>
    </div>
  </div>
  <nav style="border-top:1px solid #E7DECA;background:#FBF8F2">
    <div style="max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:30px;overflow-x:auto;scrollbar-width:none">
      <a href="Startseite.dc.html" style="flex:0 0 auto;padding:13px 0 11px;font-size:14.5px;color:#3A3C36;white-space:nowrap;border-bottom:2px solid transparent" style-hover="color:#7B2B22">Startseite<sc-if value="{{ isStart }}" hint-placeholder-val="{{ false }}"><span style="display:block;height:2px;background:#A8802F;margin:11px -2px -13px"></span></sc-if></a>
      <a href="Neuigkeiten.dc.html" style="flex:0 0 auto;padding:13px 0 11px;font-size:14.5px;color:#3A3C36;white-space:nowrap" style-hover="color:#7B2B22">Neuigkeiten &amp; Events<sc-if value="{{ isNews }}" hint-placeholder-val="{{ false }}"><span style="display:block;height:2px;background:#A8802F;margin:11px -2px -13px"></span></sc-if></a>
      <a href="Themen-und-Sammlungen.dc.html" style="flex:0 0 auto;padding:13px 0 11px;font-size:14.5px;color:#3A3C36;white-space:nowrap" style-hover="color:#7B2B22">Themen &amp; Sammlungen<sc-if value="{{ isThemen }}" hint-placeholder-val="{{ false }}"><span style="display:block;height:2px;background:#A8802F;margin:11px -2px -13px"></span></sc-if></a>
      <a href="Der-Verein.dc.html" style="flex:0 0 auto;padding:13px 0 11px;font-size:14.5px;color:#3A3C36;white-space:nowrap" style-hover="color:#7B2B22">Der Verein<sc-if value="{{ isVerein }}" hint-placeholder-val="{{ false }}"><span style="display:block;height:2px;background:#A8802F;margin:11px -2px -13px"></span></sc-if></a>
      <a href="Spenden.dc.html" style="flex:0 0 auto;padding:13px 0 11px;font-size:14.5px;color:#3A3C36;white-space:nowrap" style-hover="color:#7B2B22">Spenden<sc-if value="{{ isSpenden }}" hint-placeholder-val="{{ false }}"><span style="display:block;height:2px;background:#A8802F;margin:11px -2px -13px"></span></sc-if></a>
      <a href="Kontakt.dc.html" style="flex:0 0 auto;padding:13px 0 11px;font-size:14.5px;color:#3A3C36;white-space:nowrap" style-hover="color:#7B2B22">Kontakt<sc-if value="{{ isKontakt }}" hint-placeholder-val="{{ false }}"><span style="display:block;height:2px;background:#A8802F;margin:11px -2px -13px"></span></sc-if></a>
    </div>
  </nav>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;startseite&quot;,&quot;neuigkeiten&quot;,&quot;themen&quot;,&quot;verein&quot;,&quot;spenden&quot;,&quot;kontakt&quot;,&quot;&quot;],&quot;default&quot;:&quot;startseite&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || "";
    return {
      isStart: a === "startseite",
      isNews: a === "neuigkeiten",
      isThemen: a === "themen",
      isVerein: a === "verein",
      isSpenden: a === "spenden",
      isKontakt: a === "kontakt"
    };
  }
}
</script>
</body>
</html>
